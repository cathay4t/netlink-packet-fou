[package]
name = "netlink-packet-fou"
version = "0.1.0"
authors = ["Gris Ge <cnfourt@gmail.com>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/rust-netlink/netlink-packet-fou"
keywords = ["netlink", "linux"]
license = "MIT"
readme = "README.md"
description = "Foo over UDP (FOU) generic netlink packet definitions"

[dependencies]
netlink-packet-core = "1.0.0-rc1"
netlink-packet-generic = { git = "https://github.com/rust-netlink/netlink-packet-generic", branch = "main" }

[dev-dependencies]
pretty_assertions = "1.4.1"
